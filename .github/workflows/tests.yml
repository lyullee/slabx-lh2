name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      # The public script smoke suite is marked slow and can exceed the
      # hosted-runner wall time because it launches the full reproduction bank.
      # Fast unit/integration coverage remains required on every push.
      - run: pytest -q -m "not slow"
